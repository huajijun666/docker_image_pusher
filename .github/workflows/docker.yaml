name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '00 23 * * *'

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Mirror
    # 用 skopeo 直接 registry -> registry 复制 blob，不经过 docker 本地镜像库，
    # 因此不需要 maximize-build-space 那套分区手术，也不会因为根分区被压小而在
    # 拉取首个镜像时把磁盘写满（ubuntu-latest 切 26.04 时就是这么炸的，见 run 44883740642）。
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install skopeo
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq skopeo
        skopeo --version

    - name: Mirror and push image Aliyun
      run: |
        set -o pipefail

        AUTHFILE="$RUNNER_TEMP/skopeo-auth.json"
        SKOPEO_TMP="$RUNNER_TEMP/skopeo-tmp"
        mkdir -p "$SKOPEO_TMP"

        # 直接写 docker config.json 格式的凭据文件，免去 skopeo login 子命令
        auth=$(printf '%s:%s' "$ALIYUN_REGISTRY_USER" "$ALIYUN_REGISTRY_PASSWORD" | base64 -w0)
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$ALIYUN_REGISTRY" "$auth" > "$AUTHFILE"
        chmod 600 "$AUTHFILE"
        unset auth

        # 数据预处理，判断镜像是否重名
        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            image=$(echo "$line" | awk '{print $NF}')
            # 将 @sha256: 等字符删除
            image="${image%%@*}"
            # 获取镜像名:版本号  例如 nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            # 获取命名空间  例如 kasmweb，特殊情况 docker.io/nginx 把 docker.io 当命名空间，也 OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            # 不要是空值影响判断
            name_space="${name_space}_"
            # 获取镜像名  例如 nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            if [[ -n "${temp_map[$image_name]:-}" ]]; then
                # 已有同名镜像，判断是不是同一命名空间
                if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                fi
            else
                temp_map[$image_name]=$name_space
            fi
        done < images.txt

        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            # 形如：--platform=linux/arm64 jc21/nginx-proxy-manager:latest
            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"

            # 未写 --platform 时按 amd64 处理，与原先在 amd64 runner 上 docker pull 的默认行为一致
            if [ -z "$platform" ]; then
                platform="linux/amd64"
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi

            # linux/arm/v7 -> os=linux arch=arm variant=v7
            os="${platform%%/*}"
            rest="${platform#*/}"
            arch="${rest%%/*}"
            variant=""
            if [ "$rest" != "$arch" ]; then
                variant="${rest#*/}"
            fi

            # 获取镜像名:版本号  例如 nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            # 获取命名空间  例如 kasmweb
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            # 获取镜像名  例如 nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            # 镜像名重名且命名空间非空时，把命名空间加到前缀
            if [[ -n "${duplicate_images[$image_name]:-}" ]] && [[ -n "$name_space" ]]; then
                name_space_prefix="${name_space}_"
            fi

            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            select_args=(--override-os "$os" --override-arch "$arch")
            if [ -n "$variant" ]; then
                select_args+=(--override-variant "$variant")
            fi

            echo "=============================================================================="
            echo "copy $image ($platform)"
            echo "  -> $new_image"
            if ! skopeo copy "${select_args[@]}" \
                    --dest-authfile "$AUTHFILE" \
                    --tmpdir "$SKOPEO_TMP" \
                    --retry-times 3 \
                    "docker://$image" "docker://$new_image"; then
                echo "::error::skopeo copy failed: $image ($platform)"
                exit 1
            fi
            echo "done: $new_image"
        done < images.txt
